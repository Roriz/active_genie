# The behavior of RuboCop can be controlled via the .rubocop.yml
# configuration file. It makes it possible to enable/disable
# certain cops (checks) and to alter their behavior if they accept
# any parameters. The file can be placed either in your home
# directory or in some project directory.
#
# RuboCop will start looking for the configuration file in the directory
# where the inspected file is and continue its way up to the root directory.
#
# See https://docs.rubocop.org/rubocop/configuration
plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - 'docs/**/*'
    - 'tmp/**/*'

Style/Documentation:
  Enabled: false

# The Metrics cops skip tests, where a test reads best as one straight
# arrange-act-assert sequence, and the eval engine with its rake tasks.
# Every other file meets the limits; there are no per-file excludes.
Metrics/MethodLength:
  CountComments: false
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  AllowedMethods: ['call']
  Exclude:
    - 'test/**/*'
    - 'evals/**/*'
    - 'lib/active_genie/eval/**/*'
    - 'lib/tasks/**/*'

Metrics/ClassLength:
  CountComments: false
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'test/**/*'
    - 'evals/**/*'
    - 'lib/active_genie/eval/**/*'

Metrics/ModuleLength:
  CountComments: false
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude:
    - 'test/**/*'
    - 'evals/**/*'
    - 'lib/active_genie/eval/**/*'
    - 'lib/tasks/eval.rake'

Layout/LineLength:
  AllowedPatterns: ['\s#']
  Exclude:
    - 'test/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'evals/**/*'
    - 'lib/active_genie/eval/**/*'
    - 'lib/tasks/eval.rake'

Minitest/MultipleAssertions:
  Enabled: false

Metrics/CyclomaticComplexity:
  Exclude:
    - 'test/**/*'
    - 'evals/**/*'
    - 'lib/active_genie/eval/**/*'
    - 'lib/tasks/eval.rake'

Metrics/PerceivedComplexity:
  Exclude:
    - 'test/**/*'
    - 'evals/**/*'
    - 'lib/active_genie/eval/**/*'
    - 'lib/tasks/eval.rake'

Metrics/BlockLength:
  Exclude:
    - 'tasks/**/*'
    - 'lib/tasks/**/*'
    - '*.gemspec'

# `assert_equal true, x` checks for exactly `true`; the suggested `assert x`
# accepts any truthy value, which would weaken those assertions.
Minitest/AssertTruthy:
  Enabled: false

# Statistics code uses the textbook names (n, k, p, z).
Naming/MethodParameterName:
  Exclude:
    - 'lib/active_genie/eval/stats.rb'

# Report tables use positional width specifiers (%-28s), clearer than named tokens there.
Style/FormatStringToken:
  Exclude:
    - 'evals/**/*'
    - 'lib/active_genie/eval/**/*'
    - 'lib/tasks/eval.rake'
