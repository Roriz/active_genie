name: Eval

# Manual only: every run calls paid provider APIs. Runs the golden-set eval in eval/ against
# each release model and uploads the cached outputs and reports. See eval/README.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick (dev pool) or full (every case)'
        required: true
        default: quick
        type: choice
        options: [quick, full]
      repeat:
        description: 'Replicates per model for full runs (3 measures the noise floor)'
        required: true
        default: '1'

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake eval:check

  eval:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The API-billed release models from eval/config.json. The codex (gpt-6.1-terra) and
        # claude-code (claude-haiku-4-5) release models run on local CLI logins, so they run on a
        # developer machine: PROVIDER=codex MODEL=gpt-6.1-terra YES=1 bundle exec rake eval:full
        model:
          - { provider: google, name: gemini-3.5-flash-lite }
          - { provider: deepseek, name: deepseek-v4-flash }
    env:
      PROVIDER: ${{ matrix.model.provider }}
      MODEL: ${{ matrix.model.name }}
      YES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run ${{ inputs.mode }}
        run: |
          if [ "${{ inputs.mode }}" = "full" ]; then
            REPEAT=${{ inputs.repeat }} bundle exec rake eval:full | tee report.txt
          else
            bundle exec rake eval:quick | tee report.txt
          fi
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ inputs.mode }}-${{ matrix.model.provider }}-${{ matrix.model.name }}
          path: eval/runs/
          retention-days: 14
          if-no-files-found: ignore
