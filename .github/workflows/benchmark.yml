name: Eval

# Manual only: every run calls paid provider APIs. Runs the gem's evals in evals/ against each
# release model and uploads the cached outputs and reports. See evals/README.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick (dev pool) or full (every case)'
        required: true
        default: quick
        type: choice
        options: [quick, full]
      repeat:
        description: 'Replicates per model for full runs (3 measures the noise floor)'
        required: true
        default: '1'

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake active_genie:eval:check

  eval:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The release models. evals/config.yml pins only the dev model and the judge.
        model:
          - { provider: openai, name: gpt-6.1-luna }
          - { provider: anthropic, name: claude-haiku-4-5 }
          - { provider: google, name: gemini-3.5-flash-lite }
          - { provider: deepseek, name: deepseek-v4-flash }
    env:
      PROVIDER: ${{ matrix.model.provider }}
      MODEL: ${{ matrix.model.name }}
      YES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run ${{ inputs.mode }}
        run: |
          set -o pipefail
          repeat=1
          if [ "${{ inputs.mode }}" = "full" ]; then repeat=${{ inputs.repeat }}; fi
          # A STOP or a crash still fails the job, but only after the report reaches the summary.
          status=0
          EVAL=all MODE=${{ inputs.mode }} REPEAT=$repeat bundle exec rake active_genie:eval | tee report.txt || status=$?
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ inputs.mode }}-${{ matrix.model.provider }}-${{ matrix.model.name }}
          path: |
            evals/*/runs/
            evals/judge/
          retention-days: 14
          if-no-files-found: ignore
